name: flowops-lite

services:
  db:
    image: postgres:16-alpine
    container_name: flowops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowops_lite
      POSTGRES_USER: flowops_user
      POSTGRES_PASSWORD: flowops_password
    ports: 
      - "5432:5432"
    volumes: 
      - flowops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops_user -d flowops_lite"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flowops-pgadmin
    restart: unless-stopped
    profiles: 
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flowops.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on: 
      db:
        condition: service_healthy
    volumes:
      - flowops_pgadmin:/var/lib/pgadmin

volumes:
  flowops_pgdata:
  flowops_pgadmin: