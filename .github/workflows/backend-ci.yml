name: Backend CI

on:
  pull_request:
    branches:
      - main
    # paths:
    #   - "backend/**"
    #   - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - main
    # paths:
    #   - "backend/**"
    #   - ".github/workflows/backend-ci.yml"

jobs:
  backend-build:
    name: Backend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore FlowOps.slnx

      - name: Build
        run: dotnet build FlowOps.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FlowOps.slnx --no-build --configuration Release
